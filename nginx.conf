server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA routing (react-router-dom): any path not matching a real static
    # asset falls back to index.html so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container HEALTHCHECK target. Plain-text, no app/business logic, no
    # Supabase call - "does the bundle load" per docs/IMPROVEMENT_ROADMAP.md
    # Phase 9's own framing of this SPA's health-check scope.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets Vite content-hashes - safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
